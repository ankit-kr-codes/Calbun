name: calbun
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#428F45" 
  image: assets/images/logo.png 
  android: true
  ios: true

  android_12:
    image: assets/images/logo.png 
    icon_background_color: "#428F45"


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/

  fonts:
    - family: Delius_Swash_Caps
      fonts:
        - asset: assets/fonts/Delius_Swash_Caps/DeliusSwashCaps-Regular.ttf
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
